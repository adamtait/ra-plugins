name: claude-science
version: "1.0.0"
description: "Installs Claude Science (Anthropic's AI workbench for scientists) and auto-starts the headless workbench server at boot"
port-for-tunnel: 2719
config:
  - name: enabled
    type: bool
    description: "Install Claude Science and auto-start the workbench server?"
    default: false
  - name: working_directory
    type: string
    description: "Directory where Claude Science stores projects (leave blank for home directory)"
    default: ""
secrets:
  - name: claude_science_oauth
    env_var: CLAUDE_CODE_OAUTH_TOKEN
    description: "Claude subscription OAuth token from claude.ai/settings (Pro/Max/Team/Enterprise)"
    default_secret_name: claude-code-oauth-token
post_install_message: |
  Claude Science will start a headless workbench server on port 2719.
  Reach it from your machine with:  ra tunnel 2719  then open http://localhost:2719
